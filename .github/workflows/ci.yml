name: CI/CD

# Pipeline de CampusPulse 360 (GitHub Actions; gratis en repositorios publicos).
# - Cada push/PR: secretos (gitleaks), tipos, pruebas, build web y API.
# - main: imagen Docker del simulador en GHCR (gratis para repos publicos).
# - Deploy a Cloudflare Workers (plan Free) solo si la variable de repositorio
#   DEPLOY_ENABLED == 'true' y existen los secretos CLOUDFLARE_API_TOKEN y
#   CLOUDFLARE_ACCOUNT_ID, ademas de la variable PUBLIC_HOST (host workers.dev,
#   usado como RP ID de WebAuthn). Por defecto queda DESACTIVADO.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificacion de tipos
        run: pnpm typecheck
      - name: Pruebas (contratos, API en workerd + D1 local, web, simulador)
        run: pnpm test
      - name: Build web
        run: pnpm --filter @campuspulse/web build
      - name: Build API (dry-run, sin desplegar)
        run: pnpm --filter @campuspulse/api build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: E2E con Docker Compose + Playwright
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secretos efimeros solo para esta ejecucion (aleatorios)
        run: |
          node -e "const c=require('crypto'),fs=require('fs');const k=c.randomBytes(32).toString('hex');fs.writeFileSync('infra/local.env','GATEWAY_KEYS='+JSON.stringify({'gw-sim-01':k})+'\nGATEWAY_KEY='+k+'\nBOOTSTRAP_TOKEN='+c.randomBytes(24).toString('base64url')+'\nTELEGRAM_BOT_TOKEN=\nTELEGRAM_CHAT_ID=\n')"
      - name: Levantar stack (Worker + D1 local + simulador + cron)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Navegador de pruebas
        run: pnpm --filter @campuspulse/e2e exec playwright install --with-deps chromium
      - name: Pruebas e2e
        run: pnpm --filter @campuspulse/e2e e2e
      - name: Logs del stack si falla
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tools/e2e/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down -v

  simulator-image:
    name: Imagen Docker del simulador IoT
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Los nombres de imagen deben ir en minusculas (el owner tiene mayusculas).
      - name: Nombre de imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campuspulse-simulator" >> "$GITHUB_ENV"
      - name: Login GHCR (solo en main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/simulator/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy a Cloudflare Workers (Free)
    needs: [test, e2e, secrets-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @campuspulse/web build
      - name: Migraciones D1 (remoto)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply campuspulse-db --remote
      - name: Verificar host publico para passkeys
        run: test -n "${{ vars.PUBLIC_HOST }}" || (echo "Falta la variable de repositorio PUBLIC_HOST (p. ej. campuspulse.<subdominio>.workers.dev)" && exit 1)
      - name: Deploy
        working-directory: apps/api
        run: >
          pnpm exec wrangler deploy
          --var GIT_COMMIT:${{ github.sha }}
          --var ENVIRONMENT:production
          --var WEBAUTHN_RP_ID:${{ vars.PUBLIC_HOST }}
          --var WEBAUTHN_ORIGIN:https://${{ vars.PUBLIC_HOST }}
