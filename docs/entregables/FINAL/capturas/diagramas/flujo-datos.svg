<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2962FF"/></marker></defs>
  <rect width="1400" height="300" fill="#FFFFFF"/>
  <text x="700" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#17243A">Cadena de valor verificable (franja «Sensor → API → Reglas → Bot → Incidencia → IA → Gemelo»)</text>
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="80" width="150" height="110" rx="12" fill="#F2FBFB" stroke="#22D3D6" stroke-width="2"/><text x="95" y="120" font-weight="700" fill="#17243A">1. Sensor</text><text x="95" y="145" fill="#5B6B82">simulado</text><text x="95" y="165" fill="#5B6B82">Docker o nube</text>
    <rect x="215" y="80" width="150" height="110" rx="12" fill="#EEF3FF" stroke="#2962FF" stroke-width="2"/><text x="290" y="120" font-weight="700" fill="#17243A">2. Ingesta</text><text x="290" y="145" fill="#5B6B82">API + HMAC (Docker)</text><text x="290" y="165" fill="#5B6B82">o directa (nube)</text>
    <rect x="410" y="80" width="150" height="110" rx="12" fill="#EEF3FF" stroke="#2962FF" stroke-width="2"/><text x="485" y="120" font-weight="700" fill="#17243A">3. D1</text><text x="485" y="145" fill="#5B6B82">lecturas por</text><text x="485" y="165" fill="#5B6B82">minuto</text>
    <rect x="605" y="80" width="150" height="110" rx="12" fill="#FFF8EC" stroke="#F0B95B" stroke-width="2"/><text x="680" y="120" font-weight="700" fill="#17243A">4. Reglas</text><text x="680" y="145" fill="#5B6B82">7 reglas con</text><text x="680" y="165" fill="#5B6B82">duración sostenida</text>
    <rect x="800" y="80" width="150" height="110" rx="12" fill="#FFF8EC" stroke="#F0B95B" stroke-width="2"/><text x="875" y="120" font-weight="700" fill="#17243A">5. Bot RPA</text><text x="875" y="145" fill="#5B6B82">cron 1 min ·</text><text x="875" y="165" fill="#5B6B82">incidencia única</text>
    <rect x="995" y="80" width="170" height="110" rx="12" fill="#F2FBFB" stroke="#22D3D6" stroke-width="2"/><text x="1080" y="120" font-weight="700" fill="#17243A">6. Diagnóstico IA</text><text x="1080" y="145" fill="#5B6B82">gpt-oss-20b (JSON)</text><text x="1080" y="165" fill="#5B6B82">o reglas «sin IA»</text>
    <rect x="1210" y="80" width="170" height="110" rx="12" fill="#EEF3FF" stroke="#2962FF" stroke-width="2"/><text x="1295" y="120" font-weight="700" fill="#17243A">7. Gemelo 3D</text><text x="1295" y="145" fill="#5B6B82">color · baliza ·</text><text x="1295" y="165" fill="#5B6B82">ventana · cámara</text>
  </g>
  <g stroke="#2962FF" stroke-width="2.5" marker-end="url(#a)"><line x1="172" y1="135" x2="212" y2="135"/><line x1="367" y1="135" x2="407" y2="135"/><line x1="562" y1="135" x2="602" y2="135"/><line x1="757" y1="135" x2="797" y2="135"/><line x1="952" y1="135" x2="992" y2="135"/><line x1="1167" y1="135" x2="1207" y2="135"/></g>
  <text x="700" y="245" text-anchor="middle" font-size="15" fill="#17243A">Recuperación: «Restaurar» (administrador) o 10 min de lecturas normales → cierre automático de la incidencia y vuelta del gemelo al estado normal.</text>
  <text x="700" y="272" text-anchor="middle" font-size="13" fill="#5B6B82">Tiempo observado en producción desde el lanzamiento del escenario hasta la incidencia: ~1 min; diagnóstico: 1–3 min (uno por ciclo).</text>
</svg>
